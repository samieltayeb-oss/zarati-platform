<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#082813"/>
      <stop offset="100%" stop-color="#0F4A24"/>
    </linearGradient>
    <linearGradient id="favLeaf" x1="5" y1="7" x2="27" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="favNile" x1="23" y1="11" x2="7" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Container Base: Deep Sovereign Forest Green with subtle border -->
  <rect width="32" height="32" rx="7" fill="url(#favBg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#2E7D32" stroke-opacity="0.4"/>

  <!-- Top Agricultural Canopy Bar & Leaf Tip -->
  <path d="M 5.5 10.5 C 5.5 9 6.5 8 8 8 L 19 8 C 22.5 8 25.5 6 27 4 C 26.5 7.5 24 10.5 20.5 11.5 L 8 11.5 C 6.5 11.5 5.5 11 5.5 10.5 Z" fill="url(#favLeaf)"/>

  <!-- Dynamic Nile Confluence Diagonal -->
  <path d="M 21.5 11 C 19.5 16, 14.5 20, 7.5 24.5" stroke="url(#favNile)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Confluence current highlight -->
  <path d="M 23 11.5 C 21.5 15, 17.5 18.5, 12 22" stroke="#BAE6FD" stroke-width="0.85" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Alluvial Soil Furrow Baseline -->
  <rect x="5.5" y="23" width="15" height="3.2" rx="1.6" fill="#F8FAFC"/>

  <!-- Golden Sesame Harvest Seed -->
  <circle cx="24" cy="24.6" r="2.4" fill="#F59E0B"/>
  <circle cx="23.3" cy="23.9" r="0.7" fill="#FEF08A"/>
</svg>